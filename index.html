<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Multimedia Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>MY MULTIMEDIA PROJECT</h1>

    <div class="section">
        <h2>Photos</h2>
        <div class="grid">
            <div class="item">
                <img src="/image/itachi.jpg" alt="Itachi">
                <p>Itachi Uchiha</p>
            </div>
            <div class="item">
                <img src="image/sasuke.jpg" alt="Sasuke">
                <p>Sasuke Uchiha</p>
            </div>
            <div class="item">
                <img src="image/naruto.jpg" alt="Naruto">
                <p>Naruto Uzumaki</p>
            </div>
            <div class="item">
                <img src="image/gon.jpg" alt="Gon">
                <p>Gon Freecs</p>
            </div>
            <div class="item">
                <img src="image/killua.jpg" alt="Killua">
                <p>Killua</p>
            </div>
        </div>
    </div>

    <div class="section">
        <h2>Audio</h2>
        <div class="grid">
            <div class="item">
                <p><b>Palagi</b><br>TJ Monterde</p>
                <audio controls><source src="audio/PALAGI - TJ Monterde  OFFICIAL MUSIC VIDEO.mp3" type="audio/mpeg"></audio>
            </div>
            <div class="item">
                <p><b>Lips of an Angel</b><br>Hinder</p>
                <audio controls><source src="audio/Hinder - Lips Of An Angel (Official Music Video).mp3" type="audio/mpeg"></audio>
            </div>
            <div class="item">
                <p><b>Multo</b><br>Cup of Joe</p>
                <audio controls><source src="audio/Multo - Cup of Joe (Official Lyric Video).mp3" type="audio/mpeg"></audio>
            </div>
            <div class="item">
                <p><b>Panaginip</b><br>Nicole</p>
                <audio controls><source src="audio/Panaginip - nicole (Official Music Video).mp3" type="audio/mpeg"></audio>
            </div>
            <div class="item">
                <p><b>Merry Christmas</b><br>Alex Crichton</p>
                <audio controls><source src="audio/Alex Crichton - Merry Christmas, i miss you (Lyrics).mp3" type="audio/mpeg"></audio>
            </div>
        </div>
    </div>

    <div class="section">
        <h2>Videos</h2>
        <div class="grid">
            <div class="item">
                <p><b>Video 1</b></p>
                <video controls><source src="video/Virtual Tour  It's More Fun with You in Vigan.mp4" type="video/mp4"></video>
            </div>
            <div class="item">
                <p><b>Video 2</b></p>
                <video controls><source src="video/Virtual Tour  It's More Fun with You in Baguio.mp4" type="video/mp4"></video>
            </div>
            <div class="item">
                <p><b>Video 3</b></p>
                <video controls><source src="video/panama.mp4" type="video/mp4"></video>
            </div>
            <div class="item">
                <p><b>Video 4</b></p>
                <video controls><source src="video/LOVE Philippine Islands.mp4" type="video/mp4"></video>
            </div>
            <div class="item">
                <p><b>Video 5</b></p>
                <video controls><source src="video/Ireland's Most Stunning Places!.mp4" type="video/mp4"></video>
            </div>
        </div>
    </div>

</body>
</html>
